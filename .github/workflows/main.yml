name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: CI=false npm run build
        env:
          # Alfred's Lambda (alfred/deploy.sh). Not a secret: CRA bakes it into the public bundle anyway;
          # the Lambda's own per-IP, daily and concurrency caps are what bound the Bedrock bill.
          REACT_APP_ALFRED_URL: https://r3wo2vqnq67dblqvvz5jgna57q0yshgi.lambda-url.us-east-1.on.aws/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
